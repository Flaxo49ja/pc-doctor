<!doctype html>
<html><head><meta charset="utf-8"><title>Dead pixel test</title>
<style>
body{margin:0;height:100vh}
button{position:fixed;top:8px;left:8px;z-index:9;font:14px sans-serif;padding:6px 10px}
</style></head><body>
<button onclick="stop()">Stop</button>
<script>
const colors=["#FF0000","#00FF00","#0000FF","#FFFFFF","#000000","#FFFF00","#00FFFF","#FF00FF"];
let i=0,t=null;
function show(){document.body.style.background=colors[i%colors.length];document.title="Dead pixel test — color "+(i%colors.length+1)+"/"+colors.length;i++;}
function stop(){clearInterval(t);document.body.style.background="#222";document.title="Dead pixel test — stopped";}
show();t=setInterval(show,6000);
</script></body></html>
